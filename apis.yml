aid: concertocare
name: ConcertoCare
description: ConcertoCare is a value-based healthcare provider delivering coordinated, in-home and virtual
  medical care to Medicare-eligible seniors and adults with complex, chronic, and behavioral health needs.
  Its interdisciplinary care teams of physicians, nurse practitioners, pharmacists, and social workers
  deliver house calls, medication management, behavioral and social health support, transportation and
  nutritional assistance, caregiver support, and advanced care and palliative planning, coordinating with
  a member's existing doctors and benefit plans. The company operates as a SOC 2 Type II and HITRUST CSF
  certified organization and is a portfolio company of Obvious Ventures. It has no public API or developer
  program at this time; this profile is maintained in the API Evangelist network as a company record.
